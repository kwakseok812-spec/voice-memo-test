<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>음성 메모 정리 (테스트)</title>

  <!-- PWA: 홈 화면 설치용 -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="음성메모">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>🎙️ 음성 메모 정리</h1>
    <p>말하면 글자로 바꾸고, 핵심·할 일·결정사항으로 정리합니다 (테스트판)</p>
  </header>

  <main>
    <div id="banner"></div>

    <!-- 상태 -->
    <div class="statusrow">
      <span id="statusDot" class="dot idle"></span>
      <span id="statusText">대기 중</span>
    </div>
    <div class="level"><div id="levelBar"></div></div>

    <!-- 큰 녹음 버튼 -->
    <button id="btnRecord" class="bigbtn">🎙️&nbsp;&nbsp;녹음 시작</button>

    <!-- 보조 버튼 -->
    <div class="btnrow">
      <button id="btnDemo">예시로 정리해 보기</button>
      <button id="btnAnalyze" class="accent">다시 정리하기</button>
    </div>
    <div class="btnrow">
      <button id="btnCopy">결과 복사</button>
      <button id="btnReset">전체 지우기</button>
    </div>

    <!-- 전사 -->
    <div class="label">말하는 중 (임시)</div>
    <div id="interim"></div>

    <div class="label">전사 원문 (직접 고칠 수 있어요)</div>
    <textarea id="transcript" placeholder="녹음하면 여기에 글자가 나타납니다. 직접 고친 뒤 '다시 정리하기'를 눌러도 됩니다."></textarea>

    <!-- 정리 결과 -->
    <div class="label">정리 결과</div>
    <div id="resultArea">
      <p class="empty" style="color:#6b7280;font-size:14px;">먼저 녹음하거나 예시 버튼을 눌러 주세요.</p>
    </div>

    <!-- 저장 / 내보내기 -->
    <div class="label">저장 · 내보내기</div>
    <div class="btnrow">
      <button id="btnSave" class="accent">💾 이 메모 저장</button>
    </div>
    <div class="btnrow">
      <button id="btnWord">📄 Word</button>
      <button id="btnPpt">📊 PPT(초안)</button>
      <button id="btnMd">📝 기록(MD)</button>
    </div>
    <div id="exportMsg" class="exportmsg"></div>

    <!-- 지난 메모 -->
    <div class="label">지난 메모 <span id="historyCount" class="cnt"></span></div>
    <div id="historyList">
      <p class="empty" style="color:#6b7280;font-size:14px;">저장한 메모가 여기에 쌓입니다.</p>
    </div>
  </main>

  <!-- 지난 메모 상세 보기 (모달) -->
  <div id="modal" class="modal" style="display:none;">
    <div class="modal-box">
      <div class="modal-head">
        <span id="modalTitle">메모</span>
        <button id="modalClose" class="xbtn">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
      <div class="btnrow">
        <button id="modalWord">📄 Word</button>
        <button id="modalPpt">📊 PPT</button>
        <button id="modalDelete" class="danger">🗑 삭제</button>
      </div>
    </div>
  </div>

  <footer>
    완전 클라이언트 방식 · 서버·API 키·비용 없음<br>
    음성 인식은 브라우저(Chrome) 내장 기능을 사용하며 인터넷 연결이 필요합니다.
  </footer>

  <!-- 모듈: 녹음 → 분석 → 내보내기 → 기록 → 화면 순서로 로드 -->
  <script src="js/recorder.js"></script>
  <script src="js/analyzer.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/office-bridge.js"></script>
  <script src="js/history.js"></script>
  <script src="js/app.js"></script>

  <!-- 서비스 워커 등록 (PWA 설치 요건). https 또는 localhost에서만 동작 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.warn('SW 등록 실패:', e);
        });
      });
    }
  </script>
</body>
</html>
